<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Underwild diagnostics</title>
<!-- Startup diagnostics (see main.js): each test loads a little more of the game, so the
     log shows which part makes the page crash on a PC where the game won't start. -->
<script>
  const test = new URLSearchParams(location.search).get('t');
  if (test === 'css' || test === 'script') {
    document.write('<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../themes/minimal/theme.css">');
  }
  if (test === 'font') {
    document.write('<style>@font-face{font-family:T;src:url("../ui/MovType.ttf") format("truetype")}body{font-family:T}</style>');
  }
</script>
</head>
<body style="background:#222;color:#fff">
  <div class="menu-container"><div class="menu-content"><h1 class="game-title">UNDERWILD</h1>
  <button class="minecraft-button">Test button</button></div></div>
  <canvas id="c" width="64" height="64"></canvas>
  <script>
    if (test === 'canvas') {
      const ctx = document.getElementById('c').getContext('2d');
      ctx.fillStyle = 'red';
      ctx.fillRect(0, 0, 64, 64);
    }
    if (test === 'audio') {
      try { new AudioContext(); } catch (e) {}
    }
    setTimeout(() => window.electronAPI?.app?.diagOk?.(test), 1500);
  </script>
</body>
</html>
